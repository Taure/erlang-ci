name: 'Erlang Language Platform'
description: 'Install ELP and run lint and/or eqWAlize type checking'
author: 'novaframework'

inputs:
  version:
    description: 'ELP release tag (e.g. "2026-08-10")'
    required: false
    # First release carrying an OTP 29 binary. 2026-02-27, the previous
    # default, tops out at OTP 28 and so cannot run at all on a repo pinned to
    # 29 - which is every repo consuming this workflow.
    default: '2026-08-10'
  mode:
    description: 'Which checks to run: lint, eqwalize, or both'
    required: false
    default: 'both'
  eqwalize-scope:
    description: >-
      'all' fails on any eqwalize error in the project. 'diff' fails only on
      errors in modules this pull request touched, so a repo with an existing
      backlog can still gate new code. 'diff' needs base-ref and a checkout with
      enough history to resolve it.
    required: false
    default: 'all'
  base-ref:
    description: 'Base ref for eqwalize-scope: diff (e.g. origin/main)'
    required: false
    default: ''

outputs:
  lint-json:
    description: 'JSON summary of lint diagnostics {errors, warnings, total}'
    value: ${{ steps.lint-extract.outputs.json }}
  eqwalize-json:
    description: 'JSON summary of eqWAlize diagnostics {errors, warnings, total}'
    value: ${{ steps.eqwalize-extract.outputs.json }}

runs:
  using: 'composite'
  steps:
    - name: Install ELP
      shell: bash
      env:
        ELP_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        OTP_MAJOR=$(erl -eval 'io:format("~s", [erlang:system_info(otp_release)]), halt().' -noshell)
        # ELP names each binary after the OTP *minor* it was built against, and
        # which minors a release ships changes release to release: 2026-02-27
        # shipped otp-26.2/27.3/28, 2026-08-10 shipped otp-27.3/28.5/29. A
        # hardcoded major -> minor table therefore goes stale silently and then
        # fails a whole OTP major with "ELP does not provide binaries", which is
        # what kept the ELP jobs unusable for every OTP 29 repo. Resolve the
        # asset from the release itself instead, taking the highest minor built
        # for this major.
        ASSET=$(gh release view "$ELP_VERSION" \
                  --repo WhatsApp/erlang-language-platform \
                  --json assets \
                  --jq ".assets[].name
                        | select(test(\"^elp-linux-x86_64-unknown-linux-gnu-otp-${OTP_MAJOR}([.][0-9]+)?[.]tar[.]gz$\"))" \
                | sort -V | tail -1)
        if [ -z "$ASSET" ]; then
          echo "::error::ELP ${ELP_VERSION} ships no linux x86_64 binary for OTP ${OTP_MAJOR}. Pass a newer elp-version, or check which OTP majors that release built."
          exit 1
        fi
        echo "Installing $ASSET"
        curl -fsSL "https://github.com/WhatsApp/erlang-language-platform/releases/download/${ELP_VERSION}/${ASSET}" \
          | tar -xz -C /usr/local/bin

    - name: Compile
      shell: bash
      # `as test` so ELP can resolve test-profile deps. Without it a repo whose
      # test sources use a parse transform from a test-only dep (proper, meck)
      # gets `undefined function proper_transformer:parse_transform/2` reported
      # as a lint error in CI and nowhere else, because those deps were never
      # fetched.
      run: rebar3 as test compile

    - name: ELP Lint
      if: ${{ inputs.mode == 'lint' || inputs.mode == 'both' }}
      id: lint
      shell: bash
      run: |
        set +e
        elp lint --format json > elp-lint-output.jsonl
        set -e

    - name: Extract lint summary
      if: ${{ inputs.mode == 'lint' || inputs.mode == 'both' }}
      id: lint-extract
      shell: bash
      run: |
        if [ ! -f elp-lint-output.jsonl ] || [ ! -s elp-lint-output.jsonl ]; then
          summary='{"errors":0,"warnings":0,"total":0}'
        else
          summary=$(grep '^\s*{' elp-lint-output.jsonl | jq -sc '
            [.[] | select((.path // "") | test("(^|/)_build/") | not)] | {
              errors: [.[] | select(.severity == "error" or .severity == "Error")] | length,
              warnings: [.[] | select(.severity == "warning" or .severity == "Warning")] | length,
              total: length
            }')
          summary=${summary:-'{"errors":0,"warnings":0,"total":0}'}
        fi
        echo "json<<ELP_LINT_EOF" >> "$GITHUB_OUTPUT"
        echo "$summary" >> "$GITHUB_OUTPUT"
        echo "ELP_LINT_EOF" >> "$GITHUB_OUTPUT"
        errors=$(echo "$summary" | jq '.errors')
        if [ "$errors" -gt 0 ]; then
          echo "::error::ELP lint found $errors error(s)"
          exit 1
        fi

    - name: eqWAlize
      if: ${{ inputs.mode == 'eqwalize' || inputs.mode == 'both' }}
      id: eqwalize
      shell: bash
      run: |
        set +e
        elp eqwalize-all --format json > elp-eqwalize-output.jsonl
        set -e

    - name: Extract eqWAlize summary
      if: ${{ inputs.mode == 'eqwalize' || inputs.mode == 'both' }}
      id: eqwalize-extract
      shell: bash
      env:
        EQW_SCOPE: ${{ inputs.eqwalize-scope }}
        EQW_BASE: ${{ inputs.base-ref }}
      run: |
        if [ "$EQW_SCOPE" = "diff" ]; then
          if [ -z "$EQW_BASE" ]; then
            echo "::error::eqwalize-scope: diff needs base-ref"
            exit 1
          fi
          summary=$("$GITHUB_ACTION_PATH/../scripts/eqwalize-scope.sh" \
            elp-eqwalize-output.jsonl "$EQW_BASE")
        elif [ ! -f elp-eqwalize-output.jsonl ] || [ ! -s elp-eqwalize-output.jsonl ]; then
          summary='{"errors":0,"warnings":0,"total":0}'
        else
          summary=$(grep '^\s*{' elp-eqwalize-output.jsonl | jq -sc '
            [.[] | select((.path // "") | test("(^|/)_build/") | not)] | {
              errors: [.[] | select(.severity == "error" or .severity == "Error")] | length,
              warnings: [.[] | select(.severity == "warning" or .severity == "Warning")] | length,
              total: length
            }')
          summary=${summary:-'{"errors":0,"warnings":0,"total":0}'}
        fi
        echo "json<<ELP_EQW_EOF" >> "$GITHUB_OUTPUT"
        echo "$summary" >> "$GITHUB_OUTPUT"
        echo "ELP_EQW_EOF" >> "$GITHUB_OUTPUT"
        errors=$(echo "$summary" | jq '.errors')
        if [ "$errors" -gt 0 ]; then
          if [ "$EQW_SCOPE" = "diff" ]; then
            echo "::error::ELP eqWAlize found $errors error(s) in modules this PR touched"
          else
            echo "::error::ELP eqWAlize found $errors error(s)"
          fi
          exit 1
        fi
